<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Cat Facts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>🐱 Random Cat Facts</h1>
        <p>Click the button to fetch a new cat fact.</p>
    </header>

    <main class="app-container">

        <section class="fact-card" id="factCard" >
            <p class="placeholder-text" id="placeholderText">
                Click "Get a Cat Fact" to begin.
            </p>
        </section>

        <p class="status-message" id="statusMessage"></p>

        <button type="button" class="fetch-button" id="fetchButton">
            Get a Cat Fact
        </button>

    </main>

    <script src="script.js"></script>
</body>
</html>
